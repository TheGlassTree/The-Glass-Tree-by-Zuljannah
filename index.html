<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">

  <!-- Mobile / iPhone safe-area support -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#4F6C34">
  <meta name="description" content="Wedding location — The Glass Tree by Zuljannah, Klang, Selangor.">

  <title>Lokasi Majlis | The Glass Tree by Zuljannah</title>

  <!-- Elegant serif fonts similar to the reference design -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display:wght@400&amp;family=Cormorant+Garamond:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

  <style>    :root {
      /*
        Green sampled from the thick border in your Image 2:
        RGB 79 / 108 / 52  =  #4F6C34
      */
      --green: #4F6C34;
      --green-deep: #4D6A31;

      --white: #FFFFFF;
      --glass: rgba(255, 255, 255, 0.115);
      --glass-border: rgba(255, 255, 255, 0.38);

      --panel-radius: 30px;
      --button-radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100svh;
      min-height: 100dvh;

      /*
        The entire page background is the green from Image 2.
      */
      background:
        var(--green);

      color: var(--white);
      font-family: "Cormorant Garamond", Georgia, serif;

      /* Helps avoid accidental horizontal scrolling on phones */
      overflow-x: hidden;

      /* Prevents mobile browsers from applying tap highlights */
      -webkit-tap-highlight-color: transparent;
    }

    /*
      Subtle ambient glow behind the glass panel.
      It gives the panel a soft "frosted glass" appearance without
      changing the main green background.
    */
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
    }

    /*
      Full-screen stage.
      The panel is vertically and horizontally centered,
      as requested.
    */
    .page {
      position: relative;
      z-index: 1;

      min-height: 100svh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(28px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));
    }

    /*
      Frosted glass panel.
      On supported mobile browsers, backdrop-filter creates the
      see-through glass look.
    */
    .location-card {
      width: min(640px, 94vw);
      padding: 40px 34px 30px;

      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--panel-radius);

      backdrop-filter: blur(18px) saturate(110%);
      -webkit-backdrop-filter: blur(18px) saturate(110%);

      box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.22),
        0 4px 14px rgba(0, 0, 0, 0.11),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 -1px 0 rgba(0, 0, 0, 0.08);

      text-align: center;
    }

    .header {
      margin: 0 0 31px;

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(27px, 5.3vw, 40px);
      font-weight: 500;
      letter-spacing: 0.08em;
      line-height: 1.1;

      color: var(--white);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    .location-name {
      margin: 0;

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(26px, 5.1vw, 38px);
      font-weight: 600;
      letter-spacing: 0.045em;
      line-height: 1.18;

      color: var(--white);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    .location-name span {
      display: block;
    }

    .address {
      margin: 25px 0 35px;

      font-size: clamp(21px, 4.15vw, 30px);
      font-weight: 400;
      line-height: 1.25;
      font-style: normal;

      color: var(--white);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.14);
    }

    .address-line {
      display: block;
    }

    .map-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;

      width: 100%;
    }

    /*
      The two buttons intentionally use the same style:
      rounded outline + white icon + white text.
    */
    .map-button {
      min-height: 80px;
      width: 100%;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      padding: 12px 18px;

      border: 2px solid rgba(255, 255, 255, 0.96);
      border-radius: var(--button-radius);

      background: rgba(255, 255, 255, 0.035);
      color: var(--white);

      text-decoration: none;

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(23px, 4.5vw, 30px);
      font-weight: 700;
      line-height: 1;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 2px 8px rgba(0,0,0,0.04);

      transition:
        transform 150ms ease,
        background-color 150ms ease,
        box-shadow 150ms ease;
    }

    .map-button:hover {
      background: rgba(255, 255, 255, 0.10);
      box-shadow: 0 7px 18px rgba(0,0,0,0.12);
    }

    .map-button:active {
      transform: scale(0.975);
    }

    .map-button:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.95);
      outline-offset: 3px;
    }

    .icon {
      flex: 0 0 auto;
      width: 47px;
      height: 47px;

      display: block;
      color: var(--white);
    }

    /*
      Brand icons are loaded as SVG assets instead of approximated
      with hand-drawn paths. The CDN SVGs are already white.
    */
    .brand-icon {
      object-fit: contain;
    }

    .footer-note {
      margin: 18px 0 0;

      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;

      color: rgba(255, 255, 255, 0.78);
    }

    /*
      Small-screen adjustments.
    */
    @media (max-width: 560px) {
      .page {
        padding-left: 13px;
        padding-right: 13px;
      }

      .location-card {
        width: 94vw;
        padding: 31px 17px 22px;
        border-radius: 27px;
      }

      .header {
        margin-bottom: 24px;
        letter-spacing: 0.06em;
      }

      .location-name {
        font-size: clamp(22px, 6.4vw, 32px);
        letter-spacing: 0.035em;
      }

      .address {
        margin-top: 19px;
        margin-bottom: 27px;
        font-size: clamp(20px, 5.5vw, 27px);
      }

      .map-buttons {
        gap: 12px;
      }

      .map-button {
        min-height: 73px;
        gap: 8px;
        padding-left: 10px;
        padding-right: 10px;
        border-radius: 22px;
        font-size: clamp(20px, 5.8vw, 26px);
      }

      .icon {
        width: 41px;
        height: 41px;
      }

      .footer-note {
        display: none;
      }
    }

    @media (max-width: 360px) {
      .location-card {
        width: 95vw;
        padding-left: 13px;
        padding-right: 13px;
      }

      .map-buttons {
        gap: 8px;
      }

      .map-button {
        min-height: 68px;
        gap: 5px;
        border-width: 1.8px;
        font-size: 19px;
      }

      .icon {
        width: 37px;
        height: 37px;
      }
    }

    /*
      Respects users who request reduced motion.
    */
    @media (prefers-reduced-motion: reduce) {
      .map-button {
        transition: none;
      }
    }</style>
</head>

<body>

  <main class="page">
    <section class="location-card" aria-labelledby="location-heading">

      <h1 id="location-heading" class="header">
        LOKASI MAJLIS
      </h1>

      <div class="location-name" aria-label="The Glass Tree by Zuljannah">
        <span>THE GLASS TREE</span>
        <span>BY ZULJANNAH</span>
      </div>

      <address class="address">
        <span class="address-line">563</span>
        <span class="address-line">Jalan Dato Mohd Sidin</span>
        <span class="address-line">41300, Klang</span>
        <span class="address-line">Selangor Darul Ehsan</span>
      </address>

      <!--
        GOOGLE MAPS
        Google Maps' official cross-platform Maps URL is used.
        On mobile, Google Maps opens in the app when installed;
        otherwise the browser version opens automatically.
      -->
      <div class="map-buttons">

        <a class="map-button" href="https://www.google.com/maps/dir/?api=1&amp;destination=THE%20GLASS%20TREE%20BY%20ZULJANNAH%2C%20563%20Jalan%20Dato%20Mohd%20Sidin%2C%2041300%20Klang%2C%20Selangor%20Darul%20Ehsan%2C%20Malaysia&amp;travelmode=driving" aria-label="Open this wedding location in Google Maps">
          <!-- Recognizable Google Maps brand icon -->
          <img class="icon brand-icon" src="https://cdn.simpleicons.org/googlemaps/FFFFFF" alt="" aria-hidden="true" loading="eager">

          <span>Maps</span>
        </a>

        <!--
          WAZE
          Waze's official Deep Link URL is used.
          On mobile, Waze opens in the app when installed;
          otherwise Waze's web experience opens.
        -->
        <a class="map-button" href="https://waze.com/ul?q=THE%20GLASS%20TREE%20BY%20ZULJANNAH%2C%20563%20Jalan%20Dato%20Mohd%20Sidin%2C%2041300%20Klang%2C%20Selangor%20Darul%20Ehsan%2C%20Malaysia&amp;navigate=yes" aria-label="Open this wedding location in Waze">
          <!-- Correct Waze brand icon -->
          <img class="icon brand-icon" src="https://cdn.simpleicons.org/waze/FFFFFF" alt="" aria-hidden="true" loading="eager">

          <span>Waze</span>
        </a>

      </div>

      <p class="footer-note">
        Sila pilih aplikasi peta pilihan anda.
      </p>
    </section>
  </main>



</body></html>
